name: Deploy Backend to AWS Elastic Beanstalk

on:
  push:
    branches:
      - master
    paths:
      - "backend/**"
      - ".github/workflows/aws-deploy.yml"
  workflow_dispatch:

env:
  AWS_REGION: us-east-2
  EB_APPLICATION_NAME: club-uleam-backend
  EB_ENVIRONMENT_NAME: club-uleam-backend-env
  EB_S3_BUCKET: elasticbeanstalk-us-east-2-144273780794

jobs:
  deploy:
    name: Package and deploy backend
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Package backend
        run: |
          cd backend
          zip -r "../backend-${GITHUB_SHA}.zip" Dockerfile main.py requirements.txt

      - name: Upload package to S3
        run: |
          aws s3 cp "backend-${GITHUB_SHA}.zip" "s3://${EB_S3_BUCKET}/backend-${GITHUB_SHA}.zip"

      - name: Create Elastic Beanstalk application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name "${EB_APPLICATION_NAME}" \
            --version-label "backend-${GITHUB_SHA}" \
            --source-bundle S3Bucket="${EB_S3_BUCKET}",S3Key="backend-${GITHUB_SHA}.zip"

      - name: Deploy to Elastic Beanstalk environment
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name "${EB_ENVIRONMENT_NAME}" \
            --version-label "backend-${GITHUB_SHA}" \
            --option-settings \
              Namespace=aws:elasticbeanstalk:application:environment,OptionName=SUPABASE_URL,Value="${SUPABASE_URL}" \
              Namespace=aws:elasticbeanstalk:application:environment,OptionName=SUPABASE_KEY,Value="${SUPABASE_KEY}"

      - name: Wait for environment update
        run: |
          aws elasticbeanstalk wait environment-updated \
            --application-name "${EB_APPLICATION_NAME}" \
            --environment-names "${EB_ENVIRONMENT_NAME}"
